name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser regression tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint installer and workflows
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck install.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/test.yml .github/workflows/release.yml
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-reports
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
  test:
    name: Test on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-26-intel, macos-26, windows-2025-vs2026, windows-11-vs2026-arm]
    env:
      CGO_ENABLED: ${{ startsWith(matrix.runner, 'windows') && '0' || '1' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: node --test scripts/release.test.mjs scripts/macos-sign.test.mjs
      - name: Installer regression tests
        if: runner.os != 'Windows'
        run: node --test scripts/install.test.mjs
      - name: Check installer syntax
        run: bash -n install.sh
      - run: npm run build
        working-directory: frontend
      - name: Go tests with race detection
        if: runner.os != 'Windows'
        run: go test -race -coverprofile=coverage.out ./...
      - name: Go tests on Windows
        if: runner.os == 'Windows'
        run: go test -coverprofile=coverage.out ./...
      - name: Verify large Jira credentials in the native keychain
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          MIER_JIRA_KEYCHAIN_SMOKE: '1'
        run: go test -run '^TestRealJiraKeychainLargeRecord$' -count=1 -timeout 90s .
      - run: go vet ./...
      - name: Build the desktop application
        run: wails3 build
      - name: Verify hardened macOS app and installer packaging
        if: runner.os == 'macOS'
        run: |
          wails3 task darwin:create:app:bundle
          node scripts/macos-sign.mjs smoke bin/mag-ik-een-review.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.runner }}
          path: coverage.out

  linux-packages:
    name: Verify Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Exercise the same compatibility baseline as release packaging.
    container: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    env:
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the Linux build container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 jq zip unzip zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
      - run: npm ci
        working-directory: frontend
      - name: Build the compatible desktop application
        run: wails3 build
      - name: Build and inspect all Linux installer formats
        run: node scripts/release.mjs linux-packages "${{ matrix.arch }}" 0.1.0
