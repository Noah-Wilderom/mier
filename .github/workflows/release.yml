name: Release desktop applications
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate release and signing key
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check required signing secrets
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$UPDATER_PRIVATE_KEY" ]]; then
            printf '%s\n' '::error title=Missing updater signing key::Add the UPDATER_PRIVATE_KEY Actions repository secret using the complete private-key PEM file. See docs/RELEASING.md#signing-setup.'
            printf '%s\n' \
              '## Release setup required' \
              '' \
              'The required **UPDATER_PRIVATE_KEY** Actions repository secret is missing.' \
              'Packaging and publication are skipped until this secret is configured.' \
              '' \
              "[Signing setup](https://github.com/$GITHUB_REPOSITORY/blob/master/docs/RELEASING.md#signing-setup)" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          missing=()
          for key in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY APPLE_TEAM_ID APPLE_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!key}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error title=Missing macOS signing credentials::Configure these Actions repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          node scripts/release.mjs validate "$RELEASE_TAG"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Let GitHub append the matrix values to its default job name. A job skipped
  # before matrix expansion still has a readable name without raw expressions.
  package:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    # Preserve the Ubuntu 24.04 / glibc 2.39 release baseline on current hosts.
    container: ${{ matrix.platform == 'linux' && 'ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55' || '' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin, arch: amd64, runner: macos-26-intel }
          - { platform: darwin, arch: arm64, runner: macos-26 }
          - { platform: linux, arch: amd64, runner: ubuntu-26.04 }
          - { platform: linux, arch: arm64, runner: ubuntu-26.04-arm }
          - { platform: windows, arch: amd64, runner: windows-2025-vs2026 }
          - { platform: windows, arch: arm64, runner: windows-11-vs2026-arm }
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      CGO_ENABLED: ${{ matrix.platform == 'windows' && '0' || '1' }}
    steps:
      - name: Bootstrap the Linux build container
        if: matrix.platform == 'linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 jq zip unzip zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: node --test scripts/release.test.mjs scripts/macos-sign.test.mjs
      - name: Installer regression tests
        if: matrix.platform != 'windows'
        run: node --test scripts/install.test.mjs
      - run: npm run build
        working-directory: frontend
      - name: Browser regression tests
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:ui
      - run: go test ./...
      - name: Package ${{ matrix.platform }}/${{ matrix.arch }}
        if: matrix.platform != 'darwin'
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/release.mjs package "$TARGET_PLATFORM" "$TARGET_ARCH" "$APP_VERSION"
      - name: Sign and notarize macOS app and DMG
        if: matrix.platform == 'darwin'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: node scripts/release.mjs package darwin "$TARGET_ARCH" "$APP_VERSION"
      - name: Remove temporary macOS signing credentials
        if: always() && matrix.platform == 'darwin'
        run: node scripts/macos-sign.mjs cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/updates/*
            dist/installers/*
          if-no-files-found: error
          archive: true
          retention-days: 7

  publish:
    name: Sign updates and attach release assets
    needs: [prepare, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Sign and verify all six update archives
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: node scripts/release.mjs manifest "$RELEASE_TAG"
      - name: Validate the AUR recipe with makepkg
        run: |
          docker run --rm \
            -v "$PWD/dist/aur:/recipe:ro" \
            -v "$PWD/dist/installers:/downloads:ro" \
            archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1 \
            bash -c '
              set -e
              useradd --create-home builder
              install -d -o builder -g builder /tmp/mier-aur
              cp /recipe/PKGBUILD /recipe/.SRCINFO /tmp/mier-aur/
              cp /downloads/*.pkg.tar.zst /tmp/mier-aur/
              chown -R builder:builder /tmp/mier-aur
              cd /tmp/mier-aur
              su builder -c "makepkg --printsrcinfo > generated.SRCINFO"
              diff -u <(sed "s/^[[:space:]]*//" .SRCINFO | sort) <(sed "s/^[[:space:]]*//" generated.SRCINFO | sort)
              su builder -c "makepkg --nodeps --noconfirm"
            '
      - name: Upload installers, update archives, and checksums
        run: gh release upload "$RELEASE_TAG" dist/updates/* dist/installers/* dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish the update feed after the downloads are available
        run: gh release upload "$RELEASE_TAG" dist/manifest.json --clobber --repo "$GITHUB_REPOSITORY"
