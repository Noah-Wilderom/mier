name: Set up Wails desktop tools
description: Install the project's Go, Node, Wails CLI, and native build dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.27.x'
        cache: true
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install Linux libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev file rpm libarchive-tools desktop-file-utils
    - name: Install NSIS on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install nsis --yes --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Join-Path ${env:ProgramFiles(x86)} 'NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
    - name: Install the pinned Wails CLI
      shell: bash
      run: |
        wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
        go install "github.com/wailsapp/wails/v3/cmd/wails3@${wails_version}"
