name: Set up Wails desktop tools
description: Install the project's Go, Node, Wails CLI, and native build dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.x'
        cache: true
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install Linux libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        desktop_privilege=()
        if [[ $(id -u) != 0 ]]; then desktop_privilege=(sudo); fi
        "${desktop_privilege[@]}" apt-get update
        "${desktop_privilege[@]}" apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev file rpm libarchive-tools desktop-file-utils
    - name: Install NSIS on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install nsis --yes --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Join-Path ${env:ProgramFiles(x86)} 'NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
    - name: Install the pinned Wails CLI
      shell: bash
      run: |
        wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
        go install "github.com/wailsapp/wails/v3/cmd/wails3@${wails_version}"
