# Wails uses nFPM to build distribution packages. The release helper supplies
# GOARCH and APP_VERSION explicitly for each native Linux runner.
name: mier
arch: ${GOARCH}
platform: linux
version: ${APP_VERSION}
release: "1"
section: devel
priority: optional
maintainer: Noah Wilderom <wilderomnoah@gmail.com>
description: Mag ik een review — a desktop Git and GitHub pull request workspace
vendor: M.I.E.R. contributors
homepage: https://github.com/Noah-Wilderom/mier
# The maintainer has chosen to keep M.I.E.R. unlicensed for now.
license: unknown

contents:
  - src: ./bin/mag-ik-een-review
    dst: /usr/bin/mag-ik-een-review
    file_info:
      mode: 0755
  - src: /usr/bin/mag-ik-een-review
    dst: /usr/bin/mier
    type: symlink
  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/mag-ik-een-review.png
    file_info:
      mode: 0644
  - src: ./build/linux/mag-ik-een-review.desktop
    dst: /usr/share/applications/mag-ik-een-review.desktop
    file_info:
      mode: 0644
  - src: ./build/linux/nfpm/mier.apparmor
    dst: /etc/apparmor.d/mier
    type: config
    packager: deb
    file_info:
      mode: 0644

# Default GTK4 / WebKitGTK 6 stack: Debian 13+ and Ubuntu 24.04+.
depends:
  - git
  - libc6 (>= 2.39)
  - libgtk-4-1 (>= 4.14)
  - libwebkitgtk-6.0-4
recommends:
  - gnome-keyring
  - xdg-desktop-portal

scripts:
  postinstall: ./build/linux/nfpm/scripts/postinstall.sh
  postremove: ./build/linux/nfpm/scripts/postinstall.sh

overrides:
  rpm:
    depends:
      - git
      - glibc >= 2.39
      - gtk4 >= 4.14
      - webkitgtk6.0
    recommends:
      - gnome-keyring
      - xdg-desktop-portal
  archlinux:
    depends:
      - git
      - glibc>=2.39
      - gtk4>=4.14
      - webkitgtk-6.0
    recommends: []
    # Pacman already runs desktop-file and icon-cache transaction hooks.
    scripts:
      postinstall: ""
      postremove: ""
